name: Verify UltraSlim
# Public pull requests must not execute arbitrary code on this self-hosted machine.
on: [push, workflow_dispatch]
jobs:
  verify:
    # Register a trusted ARM64 macOS Gitea runner; see docs/BUILDING.md.
    runs-on: macos-arm64
    env:
      ULTRASLIM_BUILD_ROOT: ${{ github.workspace }}/build/ci
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies and verify
        shell: bash
        run: |
          export JAVA_HOME=/opt/homebrew/opt/openjdk@17
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          native/deps/build_deps.sh host
          native/deps/build_deps.sh android arm64-v8a "$ANDROID_HOME/ndk/27.2.12479018" 26
          scripts/verify.sh
      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultraslim-verify-artifacts
          path: |
            build/ci/app/outputs/apk/debug/app-debug.apk
            build/ci/app/outputs/apk/release/app-release-unsigned.apk
            build/ci/app/reports/**
            build/ci/host-test/Testing/**
          retention-days: 7
          if-no-files-found: ignore
