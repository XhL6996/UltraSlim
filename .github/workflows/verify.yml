name: Verify UltraSlim

# The fast check runs on every push and pull request on a disposable GitHub-hosted
# VM. The full build downloads and compiles the native stack, so it is restricted to
# a trusted self-hosted ARM64 macOS runner and only runs for pushes and manual
# dispatches — never for pull requests from forks.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layout, local links, fixture and license hashes
        run: python3 scripts/check_repository.py

  verify:
    name: Full build and tests
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    env:
      ULTRASLIM_BUILD_ROOT: ${{ github.workspace }}/build/ci
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies and verify
        shell: bash
        run: |
          export JAVA_HOME=/opt/homebrew/opt/openjdk@17
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          native/deps/build_deps.sh host
          native/deps/build_deps.sh android arm64-v8a "$ANDROID_HOME/ndk/27.2.12479018" 26
          scripts/verify.sh
      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultraslim-verify-artifacts
          path: |
            build/ci/app/outputs/apk/debug/app-debug.apk
            build/ci/app/outputs/apk/release/app-release-unsigned.apk
            build/ci/app/reports/**
            build/ci/host-test/Testing/**
          retention-days: 7
          if-no-files-found: ignore
